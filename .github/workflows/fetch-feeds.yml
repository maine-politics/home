name: Fetch RSS Feeds

on:
  schedule:
    # Every 20 minutes. Note: GitHub's scheduler can lag on low-traffic repos
    # (sometimes 10-40+ min late) — this is a GitHub platform limitation, not
    # something configurable here.
    - cron: '*/20 * * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs

      - name: Commit updated data if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ticker.json data/maine-headlines.json data/national-headlines.json
          git diff --staged --quiet || git commit -m "Update live feeds [automated]"
          git push
