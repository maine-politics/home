name: Fetch RSS Feeds

on:
  schedule:
    # Every 20 minutes. Note: GitHub's scheduler can lag on low-traffic repos
    # (sometimes 10-40+ min late) — this is a GitHub platform limitation, not
    # something configurable here.
    - cron: '*/20 * * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs

      - name: Fetch legislature data (every 6 hours)
        # Only fetch legislature data every 6 hours to avoid hammering the API
        # The 6-hour check uses the timestamp on data/legislature/war-room.json
        run: |
          if [ ! -f data/legislature/war-room.json ] || [ $(find data/legislature/war-room.json -mmin +360 | wc -l) -eq 1 ]; then
            echo "Fetching legislature data (last fetch was >6 hours ago or never)"
            node scripts/fetch-legislature.mjs
          else
            echo "Skipping legislature fetch (fetched within last 6 hours)"
          fi
        shell: bash

      - name: Commit updated data if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ticker.json data/maine-headlines.json data/national-headlines.json
          git add data/legislature/war-room.json data/legislature/bills-full.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update live feeds [automated]"
          git push
